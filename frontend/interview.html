<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Interview Trainer — Interview</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>

<header class="site-header">
  <span class="logo">🎯 AI Interview Trainer</span>
  <span class="subtitle" id="header-role">Loading…</span>
</header>

<div class="page-wrapper">

  <div id="error-alert" class="alert alert-error"></div>
  <div id="info-alert" class="alert alert-info"></div>

  <!-- Progress -->
  <div class="progress-wrap">
    <div class="progress-label">
      <span id="progress-text">Question 1 of 7</span>
      <span id="progress-pct">0%</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progress-fill" style="width:0%"></div>
    </div>
  </div>

  <!-- Question card -->
  <div class="card" id="question-card">
    <div style="display:flex;gap:8px;margin-bottom:14px;align-items:center;">
      <span class="badge" id="q-category-badge">technical</span>
      <span class="badge" id="q-difficulty-badge">medium</span>
      <span style="margin-left:auto;font-size:12px;color:#57606a;" id="q-number-label">Q1</span>
    </div>
    <p id="question-text" style="font-size:16px;font-weight:500;line-height:1.7;color:#1f2328;">
      Loading question…
    </p>
  </div>

  <!-- Answer card -->
  <div class="card">
    <h3>Your Answer</h3>
    <textarea
      id="answer-input"
      placeholder="Type your answer here…"
      rows="6"
    ></textarea>

    <div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap;">
      <button class="btn btn-primary" id="submit-btn">
        Submit Answer
      </button>
      <button class="btn btn-secondary" id="next-btn" style="display:none;">
        Next Question →
      </button>
      <button class="btn btn-success" id="finish-btn" style="display:none;">
        View Final Report
      </button>
    </div>
  </div>

  <!-- Feedback panel (shown after submission) -->
  <div class="feedback-panel" id="feedback-panel">

    <div style="display:flex;align-items:center;gap:20px;margin-bottom:16px;">
      <div class="score-circle" id="score-circle">
        <span class="score-number" id="score-number">—</span>
        <span class="score-denom">/ 10</span>
      </div>
      <div>
        <div style="font-size:15px;font-weight:700;" id="score-label">Score</div>
        <div style="font-size:13px;color:#57606a;">AI Evaluation by IBM Granite</div>
      </div>
    </div>

    <div class="feedback-section">
      <div class="feedback-label">✓ Strengths</div>
      <ul class="feedback-list" id="strengths-list"></ul>
    </div>

    <div class="feedback-section">
      <div class="feedback-label">⚡ Key Improvement</div>
      <ul class="feedback-list improvement" id="improvement-list"></ul>
    </div>

    <div class="feedback-section">
      <div class="feedback-label">💡 What a Strong Answer Includes</div>
      <ul class="feedback-list ideal" id="ideal-list"></ul>
    </div>

  </div>

</div>

<script src="/static/app.js"></script>
</body>
</html>
